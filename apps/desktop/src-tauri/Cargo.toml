[package]
name = "cryptiq"
version = "0.1.0"
description = "Cryptiq — local-first password manager"
authors = ["Cryptiq"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cryptiq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins per D-15 (Linux dropped; macOS + Windows only).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"

# PID liveness check: raw Windows syscalls via windows-sys.
# windows-sys 0.59.0 is already resolved transitively by Tauri — reuse the same version
# to avoid pulling a second copy into the binary.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

# PID liveness check on macOS: kill(pid, 0) via libc.
# libc 0.2 is already resolved transitively by Tauri — no new download needed.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
