[package]
name = "cryptiq"
version = "1.0.0"
description = "Cryptiq — local-first password manager"
authors = ["Cryptiq"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "cryptiq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Clipboard read+write for the sensitive-copy path (LOCK-02/06).
# default-features = false drops the `image-data` feature (text-only — avoids pulling
# Gdi / core-graphics). 1Password-maintained (github.com/1Password/arboard), MIT/Apache-2.0.
arboard = { version = "3", default-features = false }

# Phase 9: Noise handshake + async TCP + QR code generation (apps/desktop/src-tauri ONLY)
# Human-verified on crates.io 2026-06-04 (checkpoint:human-verify approved by user):
#   snow 0.10.0    — github.com/mcginty/snow,        MIT OR Apache-2.0
#   qrcode 0.14.1  — github.com/kennytm/qrcode-rust, MIT OR Apache-2.0
#   tokio 1.52.3   — github.com/tokio-rs/tokio,       MIT
# `time` feature required by Plan 09-04 60 s SAS-confirmation timeout (D-02 tokio::time::timeout).
snow   = "^0.10"
# L4 (hygiene, mirrors arboard minimization): only the SVG renderer is used. qrcode 0.14.1's
# default features are ["image", "svg", "pic"] — "image" pulls the `image` crate tree and "pic"
# the PIC renderer, neither of which Cryptiq uses. There is NO "std" feature in qrcode 0.14
# (verified against the crate's Cargo.toml: features = bench/pic/svg/image), so the correct
# minimal set is default-features=false + features= ["svg"].
qrcode = { version = "^0.14", default-features = false, features = ["svg"] }
tokio  = { version = "^1.49", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }

# Phase 9 GAP-B (M1): volatile secret zeroization on all pairing-session removal paths.
# zeroize is the canonical, audited, no-deps secret-wiping crate (RustCrypto org),
# MIT OR Apache-2.0. Verified on crates.io 2026-06-06 (latest 1.8.2). It uses
# core::ptr::write_volatile + a compiler fence so the wipe cannot be elided by the
# optimizer — unlike the hand-rolled `for b in ..{ *b = 0 }` loops it replaces.
zeroize = { version = "1", features = ["zeroize_derive"] }

# Phase 15: extension-bridge association crypto (BRIDGE-04/05/09). Pure-Rust NaCl-compatible
# crypto_box (RustCrypto/nacl-compat, Cure53-audited, slopcheck [OK] per 15-RESEARCH.md). This is
# NEW transport-crypto (not vault crypto) for the browser-extension pipe channel, following the
# same "Rust-side transport crypto" precedent already set by `snow` above — CLAUDE.md's
# "libsodium only" governs VAULT crypto; this is the orchestrator-locked choice for this boundary.
# Pinned EXACT (not `^0.9`) — 0.10.0-pre.0 is a pre-release and must NOT be used.
crypto_box = "=0.9.1"
# Constant-time compare for the app-layer pairing-token check (never `==` on secrets/hashes).
subtle = "2.6.1"
# BLAKE2b hash of the pairing token at rest (extension-peers.json stores ONLY the hash, never the
# raw token — CLAUDE.md "never write plaintext secrets to disk"). Already resolved transitively
# via `snow` at 0.10.6 (verified in Cargo.lock) — declaring it directly pulls NO new download,
# mirroring the existing windows-sys/libc "reuse the already-resolved version" pattern below.
blake2 = "=0.10.6"
# Wire-format base64 codec for the extension-bridge `associate`/`rpc` envelope fields
# (clientPublicKey/hostPublicKey/pairingToken/nonce/box) — matches the browser side's natural
# Uint8Array<->base64 convention. Already resolved transitively at 0.22.1 (verified in
# Cargo.lock, pulled in by Tauri's own dependency tree) — declaring it directly pins the SAME
# already-resolved version, no new download, mirroring the blake2/windows-sys reuse pattern.
base64 = "=0.22.1"

# Phase 30: first-ever HTTP client — HIBP k-anonymity range lookup, apps/desktop/src-tauri ONLY.
# Human-verified on crates.io 2026-07-10 (checkpoint:human-verify approved by user):
#   reqwest 0.13.3 — github.com/seanmonstar/reqwest, MIT OR Apache-2.0
# default-features = false + features = ["rustls"] avoids OpenSSL/native-tls and the http2/
# system-proxy bloat in reqwest's full default feature set (Windows-first; macOS via CI).
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls"] }

# DEV/TEST INFRA — PERMANENT, dev-only. hypothesi MCP bridge drives the running app over a
# localhost WebSocket during UAT (e.g. the v2.0 single-device sync checks). Registered ONLY
# under #[cfg(debug_assertions)] in lib.rs, so the WebSocket server never starts in a release
# build; bound to 127.0.0.1 (loopback). Its capability lives in the dev-only merge config
# `tauri.mcp-bridge.conf.json` (applied via `tauri dev --config` / `pnpm dev:bridge`) — NOT in
# capabilities/default.json or bootstrap.json, so it cannot reach a production build.
# Kept permanently (no more remove/re-add churn). API: Builder::new().bind_address(&str).build().
tauri-plugin-mcp-bridge = "0.11"

# Desktop-only plugins per D-15 (Linux dropped; macOS + Windows only).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"

# PID liveness check: raw Windows syscalls via windows-sys.
# windows-sys 0.59.0 is already resolved transitively by Tauri — reuse the same version
# to avoid pulling a second copy into the binary.
#
# Phase 5 additions (do NOT remove the existing two — the PID-liveness check still needs them):
#   Win32_System_DataExchange    — OpenClipboard / EmptyClipboard / CloseClipboard /
#                                  SetClipboardData / RegisterClipboardFormatW
#                                  (Windows owned sensitive write + exclusion markers, LOCK-06)
#   Win32_System_Memory          — GlobalAlloc / GlobalLock / GlobalUnlock / GMEM_MOVEABLE
#                                  (HGLOBAL for the CF_UNICODETEXT owned-transaction text write;
#                                   GlobalFree lives under the already-enabled Win32_Foundation)
#   Win32_UI_WindowsAndMessaging — WM_POWERBROADCAST + message-only window for the sleep watcher
#   Win32_System_Power           — PBT_APMSUSPEND (system-sleep detection, LOCK-01)
#   Win32_System_LibraryLoader   — GetModuleHandleW for the message-only window class
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Security_Credentials",
] }

# PID liveness check on macOS: kill(pid, 0) via libc.
# libc 0.2 is already resolved transitively by Tauri — no new download needed.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
