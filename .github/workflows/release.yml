# Cryptiq Release Pipeline — DIST-02/04/05 (P6-14)
#
# Triggers on version tag pushes (v*) only — not on every push/PR (that is ci.yml).
# Builds Windows + macOS installers via tauri-action and uploads them to a DRAFT
# GitHub Release for manual review before publish (P6-14 / T-06-23 draft-gate).
#
# Linux excluded per decision 21 (Linux structurally excluded from v1 desktop).
# No code-signing in v1 (DIST-04 — TAURI_SIGNING_PRIVATE_KEY is explicitly empty).
# No environment: gate (DIST-04 — no signing secrets exist in v1; v1.5 concern).
# No auto-updater (DIST-05 — not wiring plugin-updater; disclosed in About screen).
# TEST-10 (native E2E via tauri-driver + WebdriverIO) is DEFERRED to v1.5 (P6-13).
#
# SHA-pin enforcement: every `uses:` is pinned to a 40-char commit SHA (CVE-2025-30066 /
# Pitfall 14). scripts/lint/lint-workflow-sha-pins.mjs enforces this in CI.
# Dependabot maintains SHAs automatically (no pinDigests flag — DIST-03 records that
# pinDigests is not a valid Dependabot config field).
#
# No `concurrency:` block here, DELIBERATELY (HARD-05/D-10c, Phase 34). Cancelling a
# mid-flight tag build would abort the RCE-by-design update channel — the update channel
# IS this release funnel. Do not "helpfully" add one.
#
# NOTE, because "no concurrency block here" is only half the story: the `gate` job below
# runs ci.yml, and a called workflow's OWN concurrency block applies to the jobs it
# defines. Since `github.workflow` resolves to the CALLER's name inside a reusable
# workflow, ci.yml's group evaluates to `release-refs/tags/vX` on a tag build. ci.yml's
# `cancel-in-progress` is therefore ref-scoped (false for refs/tags/*) so that the D-10c
# invariant actually holds for the gate too — it was a bare `true`, which meant deleting
# and re-pushing the same tag WOULD have cancelled an in-flight gate. If you touch
# ci.yml's concurrency block, you are touching this workflow's tag builds.

name: release

on:
  push:
    tags:
      - 'v*'

# contents:write is required for creating the GitHub Release and uploading installer assets.
# id-token:write is required for Sigstore OIDC (attest-build-provenance/attest-sbom, Phase 35).
# attestations:write is required to publish those attestations to the repo attestation store.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # REL-01 (Phase 35): a FRESH run of the entire ci.yml job graph on the tagged commit,
  # gating `release` below. A red/skipped gate means `release` is skipped entirely — see
  # D-01b/c. This calls ci.yml ONLY (not the separate security-scan workflow) — Phase 34's
  # D-07 deliberately keeps that scan's minutes-scale latency off this fast release path;
  # do not add a dependency on it here.
  gate:
    uses: ./.github/workflows/ci.yml
    # No `secrets: inherit` — ci.yml references no `secrets.*` context anywhere (its only
    # credential is the automatic GITHUB_TOKEN, which a called workflow receives regardless).
    # `inherit` would hand the ENTIRE repo/org secret set to a workflow that runs
    # `pnpm install`, a full cargo build of two workspaces, and an NSIS installer — all
    # third-party code execution — for no benefit. This matters at the Phase-37 boundary:
    # once TAURI_SIGNING_PRIVATE_KEY exists as a repo secret, `inherit` would silently
    # expose the updater signing key to the gate's build steps. Same least-privilege posture
    # ci.yml's own `permissions:` block cites OWASP CI/CD hardening for.

  release:
    needs: [gate]
    # PLATFORM SCOPE (Phase 33, 2026-07-14) — Windows-only, in LOCKSTEP with ci.yml's
    # `build` matrix. See the long-form rationale on that job: macOS has not compiled
    # since Phase 14 (ungated Windows named pipes in the v3.0 extension bridge), and
    # there is no macOS dev machine to UAT a build on.
    #
    # Keeping this matrix in lockstep with ci.yml is the whole point: a release leg
    # that CI never exercises is an untested artifact shipped to users. If you restore
    # the macOS legs in ci.yml, restore them HERE TOO, in the same commit.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        # No `version:` — pnpm/action-setup v6 reads the pinned pnpm version from
        # package.json#packageManager. Specifying both conflicts (ERR_PNPM_BAD_PM_VERSION).
        # Single source of truth: package.json. Dependabot keeps it current.
        with:
          run_install: false

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # CI-01 lockstep with ci.yml's build job: stage the sidecar per leg before
      # tauri-action builds/bundles it.
      - name: Stage native-host sidecar (per-leg target)
        run: pnpm --filter @cryptiq/desktop stage:nmhost -- --target ${{ matrix.rust-target || '' }}

      # REL-02 GUARD (added after the v0.0.0-ci dry run, 2026-07-16). The release tag
      # is `github.ref_name` (see tauri-action `tagName` below), so a REAL tag must
      # match the app version in tauri.conf.json — otherwise we would publish
      # "v9.9.9" containing a 3.2.0 build, with nothing to catch it. The throwaway
      # dry-run tag is the ONE deliberate exception (it exists precisely to be a
      # non-matching tag), so it is skipped.
      #
      # This guard exists because the dry run caught the inverse bug: tagName was
      # 'v__VERSION__' (the APP version), while every later step used
      # `github.ref_name`. They silently agreed only while the pushed tag happened
      # to equal the app version; `v0.0.0-ci` vs 3.2.0 was the first divergence and
      # it drafted a bogus "v3.2.0" release. Tag is now the single source of truth,
      # and this asserts the app version agrees with it.
      - name: Assert pushed tag matches app version (real tags only)
        if: github.ref_name != 'v0.0.0-ci'
        shell: pwsh
        run: |
          $appVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $expected = "v$appVersion"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            Write-Error "Tag '$env:GITHUB_REF_NAME' does not match tauri.conf.json version '$appVersion' (expected '$expected'). Bump the app version to match the tag, or push the correct tag."
            exit 1
          }
          Write-Host "OK: tag '$env:GITHUB_REF_NAME' matches app version '$appVersion'."

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DIST-04: no code-signing in v1. Explicit empty values = intentionally unsigned.
          # Installers will show an "unidentified developer" warning — expected v1 limitation,
          # disclosed in the About & Security screen (UI-14). Code-signing returns post-v1.
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          # REL-02/REL-05 FIX (2026-07-16, found by the v0.0.0-ci dry run): these were
          # 'v__VERSION__', which tauri-action substitutes with the APP version from
          # tauri.conf.json — NOT the pushed git tag. Every downstream step
          # (`gh release upload`, the REL-06 assertion) addresses the release by
          # `github.ref_name`, so the two only agreed while the pushed tag happened to
          # equal the app version. Pushing v0.0.0-ci against app version 3.2.0 drafted a
          # bogus "v3.2.0" release and the upload then failed with "release not found".
          # The pushed tag is now the single source of truth; the version-match guard
          # above keeps the app version honest for real tags.
          tagName: ${{ github.ref_name }}
          releaseName: 'Cryptiq ${{ github.ref_name }}'
          releaseDraft: true
          # D-04c: ONLY the throwaway v0.0.0-ci dry-run tag is doubly-excluded from
          # releases/latest (releaseDraft:true already excludes it once; prerelease:true
          # excludes it a second, independent way). Real tags evaluate to false here.
          prerelease: ${{ github.ref_name == 'v0.0.0-ci' }}
          args: ${{ matrix.args }}

      # REL-03: install-smoke the SHIPPABLE artifact — same script/glob/runner as
      # ci.yml's build-job smoke (D-02d), now run against the real *-setup.exe this
      # job just built and drafted a release for. Gates on registry/manifest/sidecar
      # read-back, never on the installer's own exit code.
      - name: Install-smoke (silent install -> registry read-back -> silent uninstall)
        shell: pwsh
        run: ./scripts/ci/install-smoke.ps1

      # REL-02/D-03d: human-convenience checksums, NOT the attestation subject
      # (attest-build-provenance/attest-sbom compute the subject digest internally).
      #
      # Get-ChildItem with a WILDCARD that matches nothing emits no output AND no error
      # (unlike a literal missing path), so this pipeline would produce zero objects,
      # Set-Content would write an EMPTY SHA256SUMS, the step would exit 0, and the upload
      # step below would publish it. For an unsigned-installer project (DIST-04) these
      # checksums are the only integrity signal a user has, so an empty file is a real
      # integrity regression that reads as success. Today only the preceding install-smoke
      # throwing first prevents it — step ordering is not a substitute for the assertion.
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bundles = @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($bundles.Count -eq 0) { throw 'No *-setup.exe found — refusing to write an empty SHA256SUMS.' }
          $bundles |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content SHA256SUMS

      # REL-04/D-03b: directory-scan SBOM (syft) — sees BOTH Cargo.lock workspaces AND
      # pnpm-lock.yaml in one pass. Both upload flags false: this phase uploads assets
      # via one explicit `gh release upload` step below, not this action's own defaults
      # (which would otherwise open a second, ordering-dependent asset-upload path).
      - name: Generate SBOM (syft, directory scan)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # REL-04/D-03a: SLSA build provenance, bound to the installer's digest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: 'apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe'

      # REL-04/D-03c: SBOM attestation over the SAME subject digest — one
      # `gh attestation verify` call returns both predicates.
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: 'apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe'
          sbom-path: sbom.spdx.json

      # ${{ }} expressions are expanded by TEXTUAL SUBSTITUTION before the shell sees the
      # script, so interpolating them into a run: block is a command-injection sink — and
      # git ref names legally permit ; & | $ ` ( ) ' ". This job holds contents:write +
      # id-token:write + attestations:write (the Sigstore release-signing identity), so the
      # expressions are routed through env: and referenced as quoted shell vars instead —
      # the same pattern the version guard above already uses via $env:GITHUB_REF_NAME.
      #
      # `shell: bash` is NOT decoration — it is what makes `"$TAG"` mean anything. This job
      # runs on windows-2025, where the DEFAULT shell is pwsh, and in pwsh `$TAG` is an
      # undefined *PowerShell* variable that silently expands to the empty string — it does
      # NOT read the env: block. Without this line the command degrades to
      # `gh release upload "" SHA256SUMS sbom.spdx.json --clobber --repo ""`, which fails
      # with "release not found" while the env: block in the run log still shows a perfectly
      # correct `TAG: v0.0.0-ci`. That log is a red herring: the variable was set, the script
      # just could not read it. Worse, "release not found" is the SAME string the earlier
      # `tagName: v__VERSION__` defect produced, so this reads as a regression of an
      # already-fixed bug. Caught by the v0.0.0-ci dry run on 2026-07-16 (run 29499858362).
      #
      # The two steps below (`Assert releases/latest…`, `Mark the draft DO-NOT-PUBLISH…`)
      # already declare `shell: bash` — that is why they kept working when this one broke,
      # and why the draft still got marked. If you add another env:-routed step to this job,
      # give it a shell: too. Pick ONE idiom per step and match the shell to it: bash `$VAR`
      # needs `shell: bash`; pwsh needs `$env:VAR` (as the version guard above does).
      - name: Upload SHA256SUMS + SBOM to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" SHA256SUMS sbom.spdx.json --clobber --repo "$REPO"

      # REL-06 (negative half, D-04b): prove the draft THIS RUN just created never resolves
      # as releases/latest. The invariant is tag-agnostic — "the draft this run created is
      # not latest" — so it is compared against `github.ref_name`, the same single source of
      # truth `tagName` above uses. It was previously hardcoded to the throwaway `v0.0.0-ci`
      # tag, which made it a structural no-op on every real tag (a regressed draft gate on
      # v3.3.0 would compare "v3.3.0" != "v0.0.0-ci" and pass green). The POSITIVE
      # post-publish half lives in assert-latest.yml (35-03), NOT here. Deliberately does
      # NOT fetch the updater manifest (Phase-37 boundary — no updater artifacts exist yet).
      #
      # A 404 (no non-draft/non-prerelease release exists yet) IS the passing assertion, but
      # ONLY a 404: this previously branched on `$STATUS -ne 0`, so a 403 rate-limit, a 5xx,
      # an expired GH_TOKEN, or a missing `gh` all printed "expected — pass" while asserting
      # nothing. Everything that is not a definitive 404/200 now fails closed, matching
      # codeql.yml's gate and CLAUDE.md's project-wide fail-closed contract.
      - name: Assert releases/latest does not resolve to this run's draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `gh api` exits non-zero on ANY HTTP >= 400, so the 404-vs-everything-else
          # distinction cannot come from its exit code — it is read from the `-i` status
          # line instead (`--silent` drops the body, headers still print). The `|| true`
          # defuses only that HTTP-error exit; the status code itself still comes from the
          # response, and an absent/unparseable status falls through to `*` (fail closed).
          HEADERS=$(gh api "repos/${REPO}/releases/latest" -i --silent 2>/dev/null || true)
          HTTP=$(printf '%s\n' "$HEADERS" | head -1 | grep -oE '[0-9]{3}' | head -1 || true)
          case "${HTTP:-000}" in
            404)
              echo "releases/latest: 404 — no non-draft/non-prerelease release exists yet (expected) — pass."
              ;;
            200)
              LATEST=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name')
              echo "releases/latest currently resolves to tag: $LATEST"
              if [ "$LATEST" = "$TAG" ]; then
                echo "::error::releases/latest resolved to the draft this run just created ($TAG) — REL-06 violated"
                exit 1
              fi
              ;;
            *)
              echo "::error::releases/latest returned HTTP ${HTTP:-<none>} — cannot assert REL-06, failing closed."
              exit 1
              ;;
          esac

      # The draft-gate's entire safety story is "a human reviews before clicking Publish".
      # But tauri-action creates the draft AND uploads the installer BEFORE the install-smoke
      # (REL-03) can fail, and a failed job leaves that draft standing with no marker on the
      # release object itself — only in the Actions log. A human who clicks Publish without
      # cross-referencing the Actions tab ships a smoke-failed installer, and
      # assert-latest.yml would then happily confirm it as releases/latest. The human is the
      # gate, so the failure signal belongs where the human is looking. `--prerelease` also
      # buys the D-04c double-exclusion from releases/latest for free.
      - name: Mark the draft DO-NOT-PUBLISH if any prior step failed
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Deliberately NOT `set -e` before this guard: the job may have failed before
          # tauri-action ever created the draft (e.g. at the version-match guard), in which
          # case there is nothing to mark and that is not itself an error.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release exists for $TAG — nothing to mark (the job failed before the draft was created)."
            exit 0
          fi
          gh release edit "$TAG" --repo "$REPO" \
            --title "DO NOT PUBLISH — release job FAILED — Cryptiq $TAG" \
            --prerelease
          echo "Draft $TAG marked DO NOT PUBLISH (and flagged prerelease, excluding it from releases/latest)."
