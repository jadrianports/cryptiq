# Cryptiq Release Pipeline — DIST-02/04/05 (P6-14)
#
# Triggers on version tag pushes (v*) only — not on every push/PR (that is ci.yml).
# Builds Windows + macOS installers via tauri-action and uploads them to a DRAFT
# GitHub Release for manual review before publish (P6-14 / T-06-23 draft-gate).
#
# Linux excluded per decision 21 (Linux structurally excluded from v1 desktop).
# No code-signing in v1 (DIST-04 — TAURI_SIGNING_PRIVATE_KEY is explicitly empty).
# No environment: gate (DIST-04 — no signing secrets exist in v1; v1.5 concern).
# No auto-updater (DIST-05 — not wiring plugin-updater; disclosed in About screen).
# TEST-10 (native E2E via tauri-driver + WebdriverIO) is DEFERRED to v1.5 (P6-13).
#
# SHA-pin enforcement: every `uses:` is pinned to a 40-char commit SHA (CVE-2025-30066 /
# Pitfall 14). scripts/lint/lint-workflow-sha-pins.mjs enforces this in CI.
# Dependabot maintains SHAs automatically (no pinDigests flag — DIST-03 records that
# pinDigests is not a valid Dependabot config field).

name: release

on:
  push:
    tags:
      - 'v*'

# contents:write is required for creating the GitHub Release and uploading installer assets.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            args: ''
            rust-target: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        # No `version:` — pnpm/action-setup v6 reads the pinned pnpm version from
        # package.json#packageManager. Specifying both conflicts (ERR_PNPM_BAD_PM_VERSION).
        # Single source of truth: package.json. Dependabot keeps it current.
        with:
          run_install: false

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # CI-01 lockstep with ci.yml's build job: stage the sidecar per leg before
      # tauri-action builds/bundles it.
      - name: Stage native-host sidecar (per-leg target)
        run: pnpm --filter @cryptiq/desktop stage:nmhost -- --target ${{ matrix.rust-target || '' }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DIST-04: no code-signing in v1. Explicit empty values = intentionally unsigned.
          # Installers will show an "unidentified developer" warning — expected v1 limitation,
          # disclosed in the About & Security screen (UI-14). Code-signing returns post-v1.
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: 'v__VERSION__'
          releaseName: 'Cryptiq v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
