# Cryptiq CodeQL SAST (Phase 34, HARD-03 / D-06..D-08) — a DELIBERATELY separate
# workflow from `ci.yml`.
#
# D-06 (why separate): CodeQL's minutes-scale extraction+analyze latency and any
# GitHub-Advanced-Security infra flap must NOT sit on `ci-required`'s fast path —
# that aggregator's tight/fast shape is Phase 33's hard-won result. A standalone
# weekly `schedule:` (only reachable from a standalone workflow) also re-runs
# updated CodeQL query packs against unchanged code, catching newly-disclosed
# CVEs after the last commit.
#
# D-07 (why NOT in ci-required): these checks are required for merge via branch
# protection instead. That still enforces the HARD-03 red-run requirement (a
# planted vuln must fail the scan) without coupling `ci-required`'s skip=fail
# semantics to a CodeQL outage. Do NOT add a `needs:` from ci-required to any
# job here, and do NOT add this workflow's jobs to that aggregator.
#
# D-08 (build-mode: none is not a no-op for rust): `build-mode: none` is the
# ONLY mode CodeQL's Rust extractor supports (GA since bundle 2.23.3), but the
# extractor is built on rust-analyzer, which needs `cargo check`-equivalent
# access to compile `build.rs` and expand proc-macros even in "no build" mode.
# This repo's two Rust workspaces do not compile off-Windows (the same
# Phase-14 ungated named-pipe bridge that keeps macOS build legs out of
# ci.yml — see PROJECT.md), so the rust matrix leg runs on windows-2025 with
# rustup/cargo on PATH and the native-host sidecar staged BEFORE
# `codeql-action/init`, mirroring ci.yml's `rust` job CI-01 pattern
# defensively (RESEARCH.md Pitfall 2 / Assumption A2 — the actual necessity
# is confirmed empirically by the 34-04 red-run, not by this comment).
#
# Every `uses:` below is a 40-char commit SHA + `# tag` (CVE-2025-30066
# defense), gated by `lint-workflow-sha-pins.mjs` same as ci.yml.

name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, standalone from ci.yml — catches newly-disclosed CVEs

permissions:
  contents: read
  security-events: write # CodeQL uploads SARIF results

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: rust
            build-mode: none
            os: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - if: matrix.language == 'rust'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - if: matrix.language == 'rust'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - if: matrix.language == 'rust'
        name: pnpm install (frozen — needed for stage:nmhost below)
        run: pnpm install --frozen-lockfile

      # CI-01 (mirrored defensively, D-08 live risk #1): stage the native-host
      # sidecar BEFORE codeql-action/init — the Tauri crate's build.rs resolves
      # `externalBin` during a cargo-check-equivalent pass, same as ci.yml's
      # `rust` job.
      - if: matrix.language == 'rust'
        name: Stage native-host sidecar (externalBin — MUST precede codeql-action/init)
        run: pnpm --filter @cryptiq/desktop stage:nmhost

      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0

  # HARD-03's teeth. WITHOUT this job, CodeQL is advisory and nothing more:
  # `codeql-action/analyze` uploads alerts to the Security tab and exits 0 — a planted
  # critical vuln leaves the workflow GREEN. Proven live: runs 29361233154 (js/code-injection,
  # CRITICAL) and 29361228789 (actions/cache-poisoning) both went green while CodeQL was
  # correctly detecting the plant. Green-but-blind, the exact pathology this milestone exists
  # to kill, hiding inside the tool that is supposed to prevent it.
  #
  # GitHub only surfaces CodeQL as a pass/fail via the "Code scanning results" check on a
  # PULL REQUEST. Cryptiq is a solo push-to-main project (D-07 also keeps CodeQL out of
  # ci-required), so PR-gating is the wrong shape here — and branch protection with required
  # checks would REJECT direct pushes to main outright. Instead we read back the alerts CodeQL
  # just filed for this exact SHA and fail the run ourselves.
  #
  # Fails on any OPEN alert at security-severity critical|high on this ref. Lower severities
  # (medium/low/note) are reported but do not gate — the same "deny warnings but list the
  # justified exceptions" posture cargo-audit takes in ci.yml.
  codeql-gate:
    name: CodeQL Gate
    needs: analyze
    if: always() # a SKIPPED analyze must not silently pass the gate (CI-07's skip=fail lesson)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Fail if any analyze job did not succeed
        if: needs.analyze.result != 'success'
        run: |
          echo "::error::analyze did not succeed (result=${{ needs.analyze.result }}) — refusing to pass the gate"
          exit 1

      - name: Fail on critical/high code-scanning alerts for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # WHAT CLOSES THE INDEXING RACE: `codeql-action/analyze` above, NOT this loop.
          # Its `wait-for-processing` input defaults to "true" ("the Action will wait for the
          # uploaded SARIF to be processed before completing" — verified against action.yml at
          # the pinned SHA 99df26d4, v4.37.0), and the step does not override it. So by the
          # time this job runs, `analyze` has already blocked on SARIF processing.
          #
          # This loop therefore defends ONLY against the alerts API being unavailable (5xx,
          # rate-limit, transient network) — it retries on HTTP failure and fails closed on
          # exhaustion below. It is deliberately NOT a defense against not-yet-indexed alerts:
          # the endpoint returns `200 []` while indexing is pending, which is a SUCCESS, so the
          # loop would break on it immediately. An earlier version of this comment claimed the
          # loop handled that race; it never did. If `wait-for-processing` is ever disabled,
          # this loop will NOT save you — poll
          # `repos/{owner}/{repo}/code-scanning/analyses?ref=${REF}` for ${SHA} instead.
          for attempt in $(seq 1 10); do
            # --paginate: without it this read exactly ONE page. The gate's own policy is
            # that medium/low/note alerts are reported but do not gate — meaning they
            # consume the same 100-item budget, so once the repo accumulates >100 open
            # alerts a `critical` could land on page 2 and this gate would pass a
            # vulnerable commit while printing "No critical/high CodeQL alerts on this ref."
            if gh api --paginate \
                 "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${REF}&state=open&per_page=100" \
                 --jq '.[]' | jq -s '.' > alerts.json; then
              break
            fi
            echo "alerts API not ready (attempt ${attempt}/10) — retrying in 15s"
            sleep 15
            if [ "$attempt" -eq 10 ]; then
              echo "::error::could not read code-scanning alerts after 10 attempts — failing closed"
              exit 1
            fi
          done

          # NO `|| true` here. jq already exits 0 with empty output when nothing matches, so
          # it bought nothing for the intended case — all it did was swallow genuine
          # failures (malformed JSON, a truncated download, or an error-shaped response body
          # like {"message": "..."} on which `.[]` iterates object values and select throws).
          # In every one of those blocking.tsv is empty, `[ -s blocking.tsv ]` is false, and
          # the gate passes. Under `set -euo pipefail` the `|| true` was the ONLY thing
          # converting those into a green run. Let set -e fail closed instead.
          jq -r '.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high")
                 | "\(.rule.security_severity_level | ascii_upcase)\t\(.rule.id)\t\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' \
            alerts.json > blocking.tsv

          if [ -s blocking.tsv ]; then
            echo "::error::CodeQL found blocking (critical/high) alerts on this ref:"
            column -t -s $'\t' blocking.tsv
            exit 1
          fi

          TOTAL=$(jq 'length' alerts.json)
          echo "No critical/high CodeQL alerts on this ref. (${TOTAL} open alert(s) at lower severities.)"
