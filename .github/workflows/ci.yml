# Cryptiq CI — tiered job graph (Phase 33, CI-07/D-01) proving every gate actually
# executes on a push: `rust` (cargo check/clippy/test + cargo-audit for BOTH Rust
# workspaces), `node` (ESLint + one auto-discovered `pnpm lint:custom` step + typecheck
# + vitest + audit, once on Windows), `build` (tauri build, sidecar staged per leg),
# `secrets` (SHA-verified gitleaks binary scanning the pushed commit range against
# .gitleaks.toml), and `ci-required` (the single required status check — fails if any
# of the above is skipped, cancelled, or failed; a skipped job must never masquerade
# as a pass).
#
# Every `uses:` is pinned to a 40-character commit SHA (DIST-03 / Pitfall 14 /
# CVE-2025-30066 defense). Dependabot maintains these SHAs automatically because it
# detects the existing SHA-pin format in this file (no `pinDigests` flag — that field
# does not exist in the Dependabot config schema; see RESEARCH.md Open Question #6).
# EXCEPTION: the `secrets` job's gitleaks binary is pinned by version + URL + SHA256,
# not a `uses:` — deliberately NOT Dependabot-tracked (D-01/D-03, Phase 34); see that
# job's own comment for the manual bump cadence.
#
# DIST-04: Phase 1 ships UNSIGNED installers. TAURI_SIGNING_PRIVATE_KEY is explicitly
# empty so Tauri's build step knows not to attempt signing. Code-signing returns post-v1.
#
# CI-08/D-06: nearly every step below is one-command-per-step by construction (the
# tier-split itself is the structural fix — GitHub's pwsh wrapper on windows-2025 only
# checks the LAST command's $LASTEXITCODE, so a native-command failure earlier in a
# multi-line run: block can otherwise go green). Any surviving multi-line pwsh block
# must carry `$PSNativeCommandUseErrorActionPreference = $true` as its first line.
#
# CACHING/CONCURRENCY (Phase 34, HARD-05/D-10a..c): all three jobs run
# `pnpm/action-setup` BEFORE `actions/setup-node` with `cache: 'pnpm'` (setup-node's
# cache resolution shells `pnpm store path --silent`, which needs pnpm on PATH first).
# `rust`+`build` cache both Rust workspaces via `Swatinem/rust-cache` with distinct
# `shared-key`s. A top-level `concurrency` block cancels superseded runs on this
# workflow only — see release.yml for why that workflow deliberately has none.

name: ci

on:
  push:
    # v* tags run this ENTIRE graph via release.yml's `gate` job (REL-01), so they must not
    # ALSO trigger it standalone: every tag would otherwise run two complete copies of
    # rust+node+build+secrets (two full Windows builds, two installer smokes) plus the
    # release job's own third build — and produce two independent red/green signals for one
    # tag on the Actions tab, poor legibility for the funnel Phase 35 exists to make legible.
    #
    # This is a BRANCH filter, not `tags-ignore`, and that distinction is load-bearing.
    # Per GitHub's push-filter semantics: "If you define only one type of filter, such as
    # tags, the workflow will not run for events affecting the undefined ref type." So a
    # lone `tags-ignore: [v*]` silently stopped ci from running on BRANCH pushes entirely —
    # main included. It was caught on the push of the very commit that introduced it: only
    # codeql ran, ci was absent from the Actions tab. That is exactly the green-looking,
    # structurally-dead CI this milestone exists to kill, so it is stated here explicitly.
    #
    # Defining only `branches` excludes ALL tag events, which is the intent: v* tags reach
    # this graph via release.yml's `gate` (a workflow_call — a separate trigger that push
    # filters do not govern), and non-v* tags have no standalone ci story.
    #
    # Verify after touching this block: push a commit to any branch and confirm a `ci` run
    # appears. `gh run list --limit 5` — a green Actions tab that never ran is the bug.
    branches:
      - '**'
  pull_request:
  workflow_call:

# Least-privilege per OWASP CI/CD hardening. Any job that needs write access must
# override explicitly (none here).
permissions:
  contents: read

# HARD-05/D-10c: cancel a superseded run on the same branch/PR so stale runs never
# pile up gating the branch. `head_ref` first (only defined on pull_request events) so
# push-runs and PR-runs on the same branch don't cross-cancel each other's groups; only
# the newest run's `ci-required` aggregator ends up gating the branch either way.
#
# `cancel-in-progress` is REF-SCOPED, not a bare `true`, because THIS BLOCK ALSO APPLIES
# WHEN release.yml CALLS THIS WORKFLOW as its `gate` job: a called workflow's own
# concurrency governs the jobs it defines, and `github.workflow` resolves to the CALLER's
# name, so the group becomes `release-refs/tags/vX`. With a bare `true`, deleting and
# re-pushing the same tag — exactly the v0.0.0-ci dry-run ritual — would cancel an
# in-flight gate, contradicting release.yml's stated "a tag build is never cancelled"
# (D-10c). Keying off github.ref makes that invariant actually hold, in both the
# standalone and workflow_call contexts (github.event_name would NOT work here: in a
# reusable workflow it reports the CALLER's event, i.e. 'push' on a tag, not
# 'workflow_call').
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust:
    name: rust
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # HARD-02 advisory exceptions. Each ID here is a DELIBERATE, justified acceptance —
      # not a convenience mute. `--deny warnings` stays on, so anything NOT listed below
      # (including a YANKED crate, which registers as a warning) still fails the build.
      # That is what keeps this a gate rather than a rubber stamp.
      #
      # Reviewed 2026-07-15 against a live `cargo audit` on both workspaces. apps/native-host
      # is CLEAN (0 advisories) and deliberately gets NO exceptions.
      #
      # Two advisories were fixed properly rather than ignored, and are absent from this list:
      #   plist 1.9.0 -> 1.10.0   pulls quick-xml 0.41 (drops the Windows-reachable 0.39.4)
      #   anyhow 1.0.102 -> 1.0.103   clears RUSTSEC-2026-0190 (unsound)
      #
      # GROUP A — Linux-only, structurally unreachable. Cryptiq excludes Linux (see CLAUDE.md);
      # these crates live behind the GTK3/X11/Wayland backends of `arboard` + Tauri and are
      # never compiled on the Windows or macOS targets we ship. `cargo audit` reads the
      # lockfile, which is target-agnostic, so it flags them anyway.
      # quick-xml 0.39.4 (RUSTSEC-2026-0194/0195, 7.5 high) survives ONLY via
      # wayland-scanner <- wl-clipboard-rs <- arboard. Verified: `cargo tree -i
      # quick-xml@0.39.4` prints nothing on the Windows target, and only the wayland
      # chain under `--target all`. If Linux support is ever added, these MUST come back.
      #
      # GROUP B — Windows-reachable, but no upstream fix exists. All are `unmaintained`
      # notices (not vulnerabilities) on crates pinned by Tauri itself: bincode 1.x via
      # tauri-plugin-persisted-scope, and the unic-* family via urlpattern <- tauri-utils.
      # We cannot bump past them without Tauri doing so first. Re-check on each Tauri bump.
      CARGO_AUDIT_IGNORES: >-
        --ignore RUSTSEC-2026-0194
        --ignore RUSTSEC-2026-0195
        --ignore RUSTSEC-2024-0413
        --ignore RUSTSEC-2024-0416
        --ignore RUSTSEC-2024-0412
        --ignore RUSTSEC-2024-0418
        --ignore RUSTSEC-2024-0411
        --ignore RUSTSEC-2024-0417
        --ignore RUSTSEC-2024-0414
        --ignore RUSTSEC-2024-0415
        --ignore RUSTSEC-2024-0420
        --ignore RUSTSEC-2024-0419
        --ignore RUSTSEC-2024-0429
        --ignore RUSTSEC-2024-0370
        --ignore RUSTSEC-2025-0141
        --ignore RUSTSEC-2025-0081
        --ignore RUSTSEC-2025-0075
        --ignore RUSTSEC-2025-0080
        --ignore RUSTSEC-2025-0100
        --ignore RUSTSEC-2025-0098
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        # No `version:` — pnpm/action-setup v6 reads the pinned pnpm@11.13.0 from
        # package.json#packageManager. Specifying both conflicts (ERR_PNPM_BAD_PM_VERSION).
        # Single source of truth: package.json. Dependabot keeps it current.
        with:
          run_install: false

      # HARD-05/D-10a: pnpm MUST be on PATH before setup-node's `cache: 'pnpm'` runs —
      # it shells `pnpm store path --silent` to resolve the cache folder. Reordering
      # this after pnpm/action-setup (was previously first) is the actual fix.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy

      # HARD-05/D-10b: caches target/ + registry for BOTH Rust workspaces (auto-detect
      # only covers cwd and would leave native-host cold). shared-key distinct from the
      # `build` job's `rust-build` so dev-profile (check/clippy/test) and release-profile
      # (tauri build) artifacts never evict each other.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/native-host
          shared-key: rust-checks

      # CI-01: tauri-build's build script resolves `externalBin` entries DURING
      # `cargo check` itself (not only at bundle time) — staging MUST precede any
      # cargo step in this job, not just precede `tauri build`. rust-cache does NOT
      # cache the sidecar binary, so staging still runs every time.
      - name: Stage native-host sidecar (externalBin — MUST precede any cargo step)
        run: pnpm --filter @cryptiq/desktop stage:nmhost

      - name: cargo check (Tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: cargo clippy (Tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test (Tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: cargo check (native-host)
        working-directory: apps/native-host
        run: cargo check

      - name: cargo clippy (native-host)
        working-directory: apps/native-host
        run: cargo clippy -- -D warnings

      - name: cargo test (native-host)
        working-directory: apps/native-host
        run: cargo test

      # HARD-02/D-05: cargo-audit only parses each Cargo.lock — it does not compile
      # either workspace, so this is cheap even though it runs after the full
      # check/clippy/test suite above. `--deny warnings` also fails on yanked and
      # unmaintained crates, not only advisories with a CVE.
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
        with:
          tool: cargo-audit

      # Two NAMED steps (not a loop), one per literal Cargo.lock path — a missing or
      # renamed lockfile surfaces as its own distinct red step (CI-08 one-command-per-
      # step discipline), and each Rust workspace must be red-run independently to
      # prove native-host is genuinely audited, not just src-tauri (the four-milestone
      # blind-spot this phase exists to close).
      - name: cargo audit (Tauri)
        run: cargo audit --deny warnings --file apps/desktop/src-tauri/Cargo.lock ${{ env.CARGO_AUDIT_IGNORES }}

      # `if: always()` is load-bearing, not defensive boilerplate. Steps are sequential:
      # without it, a red Tauri audit SKIPS this step entirely, so the native-host
      # workspace goes unaudited exactly when something is already wrong — which is the
      # four-milestone blind spot this phase exists to close. Verified by an observed
      # red-run: with both audits red, each must fail at its OWN named step.
      - name: cargo audit (native-host)
        if: always()
        run: cargo audit --deny warnings --file apps/native-host/Cargo.lock ${{ env.CARGO_AUDIT_IGNORES }}

  node:
    name: node
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          run_install: false

      # HARD-05/D-10a: pnpm on PATH before setup-node's `cache: 'pnpm'` (see rust job).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      # D-09/D-11 (Phase 38, 38-03, Pitfall 3) — apps/site's real-browser round-trip
      # and detector specs now run in the root `vitest run` aggregator (test.projects
      # widened in vitest.config.ts). Without a Chromium binary here, those
      # browser-mode specs would fail/skip on this runner. apps/site/vitest.config.ts's
      # local flaky-CDN escape-hatch env var is deliberately left unset here —
      # GitHub-hosted runners reach the Playwright CDN fine, so Playwright manages its
      # own install and no local override is needed.
      - name: Playwright install chromium
        # `playwright` is a devDependency of the workspace packages (apps/site,
        # apps/desktop), NOT the repo root — so a root `pnpm exec playwright` fails
        # with "Command 'playwright' not found". Resolve the CLI from the workspace
        # that owns it. (This step is unreachable by the local flaky-CDN escape hatch,
        # so it was only ever proven in CI — 38-VERIFICATION human-verify caught it.)
        run: pnpm --filter @cryptiq/site exec playwright install chromium

      - name: ESLint
        run: pnpm exec eslint .

      # HARD-06/D-11: auto-discovers scripts/lint/lint-*.mjs (run-all.mjs, 34-01) —
      # a new lint file is wired automatically, no hardcoded step list to drift out of
      # sync. Prints a `▶ <lint-name>` banner per lint so a failure is still legibly
      # named in the run log (the whole point of the collapse is DRY, not opacity).
      # The Vite key-leak guard's Stage B (post-build dist grep) skips gracefully here
      # since dist/ doesn't exist pre-build; its Stage B re-runs standalone in `build`
      # below, unchanged, as its own separate step.
      - name: Custom lints (auto-discovered)
        run: pnpm lint:custom

      - name: svelte-check + tsc --noEmit
        run: pnpm run typecheck

      - name: vitest run
        run: pnpm exec vitest run

      - name: pnpm audit (HIGH/CRITICAL = fail)
        run: pnpm audit --prod --audit-level=high

  build:
    name: build
    # PLATFORM SCOPE (Phase 33, 2026-07-14) — Windows-only, deliberately.
    #
    # The macOS legs (macos-latest x aarch64/x86_64) were REMOVED, not silently
    # dropped. When Phase 33 resurrected this pipeline, its first live run proved
    # macOS has not compiled since Phase 14: the v3.0 extension bridge uses
    # Windows named pipes with no cfg gating on BOTH sides —
    #   apps/native-host/src/main.rs                        (ClientOptions/NamedPipeClient)
    #   apps/desktop/src-tauri/src/commands/extension_bridge.rs  (NamedPipeServer/ServerOptions)
    # so `cargo build --target *-apple-darwin` fails outright (E0433).
    # Red-run evidence: https://github.com/jadrianports/cryptiq/actions/runs/29320174285
    #
    # macOS SOURCE SUPPORT IS INTACT AND INTENTIONAL — clipboard.rs and pairing.rs
    # keep their #[cfg(target_os = "macos")] paths, and capabilities still declare
    # platforms: ["windows","macOS"]. Only the BUILD LEGS are gone. Restoring macOS
    # = re-add these legs + cfg-gate (or port) the named-pipe bridge. Nothing else
    # was unwound, so this stays cheap to reverse.
    #
    # Rationale: there is no macOS dev machine on this project (CLAUDE.md), so a
    # macOS build could never be UAT'd — shipping an unverifiable artifact is worse
    # than shipping none. Gating on a leg that cannot go green would also mean
    # ci-required is red forever, which is the exact "green CI that isn't green"
    # pathology this phase exists to kill.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          run_install: false

      # HARD-05/D-10a: pnpm on PATH before setup-node's `cache: 'pnpm'` (see rust job).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # HARD-05/D-10b: distinct shared-key (`rust-build`) from the `rust` job's
      # `rust-checks` — release-profile tauri-build artifacts never evict dev-profile
      # check/clippy/test artifacts, and vice versa.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/native-host
          shared-key: rust-build

      # CI-12 / CLEAN-CLONE SMOKE — deliberately does NOT pre-stage the sidecar.
      #
      # `pnpm build` -> `pnpm -r build && pnpm --filter ./apps/desktop tauri:build`,
      # and `tauri:build` is itself `pnpm stage:nmhost && tauri build`. So the root
      # build script stages its own sidecar — exactly as a user's clean clone does.
      #
      # An explicit staging step HERE used to mask that: the CI-06 red-run for
      # `clean-clone-smoke.patch` (which reverts tauri:build -> bare `tauri build`)
      # came back GREEN, proving this job was NOT gating CI-12 at all. Pre-staging
      # made the root script's correctness irrelevant. Removing it turns this job
      # into a real clean-clone smoke test.
      # Fake-green evidence:  https://github.com/jadrianports/cryptiq/actions/runs/29321815825
      #
      # The `rust` job still stages explicitly, and MUST — there, `cargo check`
      # resolves externalBin directly with no tauri:build wrapper to stage for it (CI-01).
      - name: pnpm build (Vite + tauri build — stages its own sidecar via tauri:build)
        env:
          # DIST-04: Phase 1 ships unsigned. Explicit empty values signal "intentionally not signing".
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm build

      # CI-10: Stage B of the Vite key-leak guard only means something once dist/**
      # actually exists — runs here, post-build, on every leg.
      - name: Vite key-leak dist grep
        run: node scripts/lint/lint-vite-key-leak.mjs

      # DEMO-02 / D-07 (Phase 38, 38-03) — the CI-enforced half of the containment
      # lint. `pnpm build` above is `pnpm -r build && ...`, so apps/site/dist exists
      # by this point; the node job's `pnpm lint:custom` runs the same lint pre-build,
      # where it skips gracefully (apps/site/dist doesn't exist there yet).
      - name: Demo containment lint (post-build dist scan)
        run: node scripts/lint/lint-demo-containment.mjs

      # DEMO-07 evidentiary integrity (39-01, T-39-01-R) — the printed "audit
      # it yourself" core commit SHA must byte-equal the real build commit,
      # not just look like a 40-hex string. Authored + wired here; goes green
      # once 39-02/39-03 render __CORE_COMMIT_SHA__ into the page (see the
      # lint's own header comment for why it is expected to fail until then).
      - name: Demo SHA-equality lint (post-build dist scan)
        run: node scripts/lint/lint-demo-sha.mjs

      # REL-03 (build-job half) / D-02d: install-smokes the *-setup.exe this same
      # runner just built — the earliest point the DIST-02 `-196608` class of bug
      # could be caught. Local to this runner (same job that just ran `pnpm build`),
      # so no actions/download-artifact needed. Gates on registry read-back inside
      # the script, never on the installer's own exit code (see script header).
      - name: Install-smoke (silent install -> registry read-back -> silent uninstall)
        shell: pwsh
        run: ./scripts/ci/install-smoke.ps1

  secrets:
    name: secrets
    runs-on: windows-2025
    timeout-minutes: 15
    # HARD-01/D-01/D-02: gitleaks *binary*, not gitleaks/gitleaks-action — the Action
    # requires a paid GITLEAKS_LICENSE for org-owned repos (a latent trap if this repo
    # ever transfers to an org) and drags in a GITHUB_TOKEN dependency the binary path
    # never needs. Pinned by version + URL + SHA256 instead of a `uses:` — this is a
    # DELIBERATE exception to the repo's SHA-pin-every-`uses:` rule, so it is NOT
    # Dependabot-tracked and NOT covered by lint-workflow-sha-pins.mjs. Manual bump
    # cadence: watch https://github.com/gitleaks/gitleaks/releases and update both the
    # version and SHA256 below (same values are reused in gitleaks-full.yml).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The incremental scan below walks `github.event.before..after`. The default
          # depth-1 checkout has none of those commits, so the range would be unwalkable.
          fetch-depth: 0

      - name: Download + verify gitleaks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ver = '8.30.1'
          $sha = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$ver/gitleaks_${ver}_windows_x64.zip" -OutFile gitleaks.zip
          $actual = (Get-FileHash gitleaks.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) {
            Write-Error "gitleaks SHA256 mismatch: expected $sha, got $actual"
            exit 1
          }
          # MUST unpack into a subdirectory: the gitleaks zip ships its own LICENSE, which
          # collides with this repo's LICENSE at the root and makes Expand-Archive fail —
          # a red `secrets` job on every branch that never actually runs gitleaks.
          Expand-Archive gitleaks.zip -DestinationPath gitleaks-bin

      # D-03: incremental scan — the pushed commit range on `push`, the PR range on
      # `pull_request`. `github.event.before` is all-zeros on a repo's first push (no
      # prior commit to range from), so fall back to scanning HEAD alone in that case.
      # The weekly full-history sweep in gitleaks-full.yml is the backstop for anything
      # this range misses (force-push, rewritten history, a bad/missing range).
      - name: gitleaks scan (incremental)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $range = '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
          } elseif ('${{ github.event.before }}' -match '^0+$') {
            $range = 'HEAD'
          } else {
            $range = '${{ github.event.before }}..${{ github.event.after }}'
          }
          # --verbose names the RULE and file for each finding; without it the log says only
          # "leaks found: 2", which tells an on-call reader nothing (the same legibility bar
          # HARD-06 sets for lint:custom). --redact is MANDATORY alongside it: this repo is
          # public, so a real finding must never echo the secret itself into the run log.
          ./gitleaks-bin/gitleaks.exe git --config .gitleaks.toml --log-opts="$range" --verbose --redact .

  pages:
    name: pages
    # DEMO-11 (39-04) — push-to-main-only GitHub Pages deploy of apps/site. Deliberately
    # excluded from ci-required's `needs:` below: this job is INTENTIONALLY skipped on
    # every pull_request run (no `pages: write`/`id-token: write` trust on a PR), and a
    # required aggregator must never fail on a job that is legitimately skipped by design
    # (the same "skipped must never masquerade as a pass" principle applied in reverse —
    # here a skip is the CORRECT, expected outcome on a PR, not a gap to gate on).
    #
    # ubuntu-latest, not windows-2025: apps/site has zero Tauri/Rust dependency, so this
    # runs independently of (and much faster than) the Windows build matrix above.
    #
    # actions/checkout, pnpm/action-setup, actions/setup-node reuse the SAME SHAs already
    # pinned elsewhere in this file (do not re-resolve those). actions/upload-pages-artifact
    # and actions/deploy-pages are net-new for this job; their SHAs were resolved live via
    # `gh api repos/actions/<name>/git/refs/tags/v5.0.0` at execution time (both tags point
    # directly at a commit object, not an annotated tag needing dereference) — never
    # hand-copied from a doc fetch (CVE-2025-30066).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          run_install: false

      # HARD-05/D-10a: pnpm on PATH before setup-node's `cache: 'pnpm'` (see rust job).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build apps/site
        run: pnpm --filter @cryptiq/site build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: apps/site/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [rust, node, build, secrets]
    if: always()
    steps:
      - name: Verify no required job was skipped, cancelled, or failed
        shell: bash
        run: |
          echo "rust:    ${{ needs.rust.result }}"
          echo "node:    ${{ needs.node.result }}"
          echo "build:   ${{ needs.build.result }}"
          echo "secrets: ${{ needs.secrets.result }}"

      - name: Fail if any required job did not succeed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        shell: bash
        run: |
          echo "::error::One or more required CI jobs was skipped, cancelled, or failed."
          exit 1
